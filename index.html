<style>
:root{--navy:#071a2d;--navy2:#0b2945;--gold:#c9a65e;--gold2:#ead6a5;--ink:#f5f7fa;--muted:#a9bacb;--line:rgba(220,232,243,.14);--glass:rgba(5,23,41,.91);--green:#68d3a1;--blue:#67b5e5}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061629;color:var(--ink);font-family:'DM Sans',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
#app{position:relative;width:100%;height:100%;isolation:isolate}#globeViz{position:absolute;inset:0;z-index:0}#globeViz canvas{outline:none}
.shade{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(2,12,23,.7),transparent 20%,transparent 64%,rgba(2,12,23,.52))}
.topbar{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 22px;background:linear-gradient(180deg,rgba(2,13,25,.76),transparent)}
.brand{display:flex;align-items:center;gap:11px}.logo{width:39px;height:39px;border:1px solid rgba(201,166,94,.75);border-radius:50%;display:grid;place-items:center;color:var(--gold2);font-size:21px}.brand b{display:block;font-size:10px;letter-spacing:.2em;color:var(--gold2)}.brand small{display:block;margin-top:4px;font-size:9px;letter-spacing:.17em;color:#d4e0eb}

.map-tools{position:absolute;z-index:4;left:18px;top:45%;display:grid;gap:7px}.map-tools button{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:rgba(5,24,43,.82);color:#e9eff5;font-size:17px;backdrop-filter:blur(12px)}
.map-tools button:hover{border-color:var(--gold);color:var(--gold2)}

.kicker{font-size:9px;letter-spacing:.17em;color:var(--gold2);font-weight:700}.summary-route{display:flex;align-items:center;justify-content:space-between;margin:8px 0}.summary-route b{font:600 25px 'Playfair Display',serif}.summary-route span{color:var(--gold);font-size:19px}.summary-meta{display:flex;justify-content:space-between;gap:6px;color:#b8c8d8;font-size:10px}.summary-meta strong{color:#f0f4f8}.route-photos{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.route-photo{position:relative;height:54px;border-radius:8px;overflow:hidden;border:1px solid rgba(232,201,121,.45)}.route-photo img{width:100%;height:100%;object-fit:cover;opacity:.8}.route-photo b{position:absolute;left:6px;bottom:5px;font-size:10px;text-shadow:0 1px 5px #000}
.bottom-dock{position:absolute;z-index:7;left:50%;bottom:17px;transform:translateX(-50%);display:flex;gap:5px;padding:6px;border:1px solid var(--line);border-radius:17px;background:rgba(4,19,35,.94);backdrop-filter:blur(18px);box-shadow:0 12px 40px #0006}
.tab{display:flex;align-items:center;gap:8px;padding:11px 15px;border:0;border-radius:12px;background:transparent;color:#b9c8d6;font-size:11px;white-space:nowrap}.tab .ico{font-size:16px}.tab.active{background:rgba(201,166,94,.17);color:var(--gold2);box-shadow:inset 0 0 0 1px rgba(201,166,94,.25)}
.drawer{position:absolute;z-index:6;right:18px;top:84px;bottom:86px;width:370px;max-height:calc(100% - 170px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:20px;background:var(--glass);backdrop-filter:blur(22px);box-shadow:0 20px 70px #0007;overflow:hidden;transition:transform .25s,opacity .25s}
.drawer.hidden{opacity:0;pointer-events:none;transform:translateX(18px)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}.drawer-head h2{margin:0;font:600 20px 'Playfair Display',serif}.drawer-head small{display:block;color:var(--gold2);font-size:9px;letter-spacing:.16em;margin-bottom:4px}.close{border:1px solid var(--line);border-radius:9px;background:transparent;color:#dce5ed;padding:7px 10px}
.drawer-content{padding:15px 17px 22px;overflow:auto;overscroll-behavior:contain;flex:1}.muted{color:var(--muted)}.subheading{font-size:10px;letter-spacing:.14em;color:var(--gold2);font-weight:700;margin:17px 0 9px}
.flight-card,.airport-card,.doc-card,.check-card,.city-card{padding:12px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.035);margin-bottom:9px}
.flight-card{cursor:pointer}.flight-card.selected{border-color:rgba(201,166,94,.72);background:rgba(201,166,94,.10)}.flight-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.flight-no{font-weight:700;color:var(--gold2);font-size:12px;letter-spacing:.08em}.flight-date{font-size:10px;color:#aebfce}.flight-route{display:flex;align-items:center;gap:11px;margin:9px 0}.flight-route b{font:600 22px 'Playfair Display',serif}.flight-route span{font-size:10px;color:#9eb0c1}.flight-foot{display:flex;justify-content:space-between;color:#b5c5d3;font-size:10px}.status{font-size:9px;padding:4px 7px;border-radius:20px;background:rgba(104,211,161,.12);color:var(--green)}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.month-nav strong{font:600 17px 'Playfair Display',serif}.month-nav button{background:transparent;color:var(--gold2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekday{text-align:center;font-size:9px;color:#879bad;padding:4px 0}.day{position:relative;min-height:37px;border:1px solid transparent;border-radius:9px;background:rgba(255,255,255,.035);color:#d9e2ea;font-size:10px}.day.dim{opacity:.32}.day.today{border-color:var(--gold)}.day.has-flight:after{content:'';position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--green)}.day.selected{background:rgba(201,166,94,.2);border-color:var(--gold2);color:#fff}
.field{display:grid;gap:5px;margin:9px 0}.field label{font-size:9px;color:#aebfce;letter-spacing:.1em}.field input,.field select,.field textarea,.search{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:rgba(255,255,255,.055);color:#f2f5f8;outline:none;font-size:11px}.field option{background:#0b2945}.field textarea{min-height:70px;resize:vertical}
.btn{border:0;border-radius:9px;padding:10px 13px;background:linear-gradient(100deg,#b48d45,#e4c77e);color:#10243a;font-weight:700;font-size:10px;letter-spacing:.06em}.btn.secondary{background:rgba(255,255,255,.07);border:1px solid var(--line);color:#e1eaf2}.btn-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.route-pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.route-pair .airport-card{margin:0}.route-pair b{font:600 21px 'Playfair Display',serif;color:var(--gold2)}.airport-card h3{margin:0 0 4px;font-size:13px}.airport-card p{font-size:10px;line-height:1.55;color:#b6c6d5;margin:7px 0}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:10px;border-radius:10px;background:rgba(255,255,255,.045)}.metric small{display:block;color:#91a5b8;font-size:8px;letter-spacing:.1em}.metric b{display:block;margin-top:5px;font-size:11px;color:#f0f4f8}
.city-tag{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;margin:3px;border:1px solid rgba(201,166,94,.5);border-radius:18px;color:var(--gold2);background:rgba(5,23,41,.88);font-size:9px;cursor:pointer}.city-tag:hover{background:rgba(201,166,94,.18)}.city-tag:focus-visible,.map-sticker:focus-visible{outline:2px solid #ffe08a;outline-offset:3px}
.doc-card{display:flex;align-items:center;gap:10px}.doc-icon{width:35px;height:38px;display:grid;place-items:center;border-radius:8px;background:rgba(201,166,94,.14);color:var(--gold2);font-size:17px;flex:none}.doc-main{min-width:0;flex:1}.doc-main b{display:block;font-size:11px;overflow-wrap:anywhere}.doc-main small{display:block;color:#91a5b8;font-size:9px;margin-top:4px}.doc-actions{display:flex;gap:5px}.doc-actions button{border:1px solid var(--line);border-radius:7px;background:transparent;color:#d9e4ed;padding:6px 7px;font-size:10px}
.check-card{display:flex;align-items:flex-start;gap:9px}.check-card input{accent-color:var(--gold);margin-top:2px}.check-card b{font-size:11px}.check-card small{display:block;color:#9fb1c2;font-size:9px;margin-top:4px;line-height:1.4}
.progress{height:5px;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden;margin:9px 0}.progress span{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
.empty{padding:18px;text-align:center;color:#9eb0c1;font-size:11px;border:1px dashed var(--line);border-radius:12px;line-height:1.6}
.toast{position:absolute;z-index:12;left:50%;top:85px;transform:translate(-50%,-8px);opacity:0;pointer-events:none;padding:9px 14px;border:1px solid rgba(201,166,94,.4);border-radius:10px;background:rgba(5,22,40,.96);color:var(--gold2);font-size:11px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
.sim-progress{height:6px;border-radius:10px;background:#ffffff18;overflow:hidden;margin:12px 0}.sim-progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#b48d45,#f5dfad);transition:width .08s linear}.sim-hero{position:relative;height:145px;border-radius:13px;overflow:hidden;margin-bottom:10px;background:#102a40}.sim-hero img{width:100%;height:100%;object-fit:cover;opacity:.82}.sim-hero:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#071a2d)}.sim-hero div{position:absolute;z-index:1;left:13px;bottom:12px;font:600 23px 'Playfair Display',serif;color:white;text-shadow:0 2px 12px #000}.sim-endpoints{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sim-endpoint{position:relative;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#102a40;min-width:0}.sim-endpoint img{width:100%;height:75px;object-fit:cover;display:block}.sim-endpoint div{padding:8px}.sim-endpoint b{font-size:12px;color:var(--gold2)}.sim-endpoint small{display:block;color:#b6c6d5;font-size:9px;margin-top:3px}.map-sticker{pointer-events:auto!important;touch-action:manipulation;position:relative;z-index:8;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 7px;border:1px solid rgba(234,214,165,.82);border-radius:13px;background:linear-gradient(145deg,rgba(10,38,61,.98),rgba(3,16,30,.96));color:#f5dfad;font:700 9px 'DM Sans',sans-serif;white-space:nowrap;box-shadow:0 5px 20px #0009;cursor:pointer;transform:translateY(-3px);transition:transform .2s,filter .2s}.map-sticker:hover{transform:translateY(-7px) scale(1.12);filter:brightness(1.25)}.map-sticker .landmark{font-size:25px;line-height:1.05;filter:drop-shadow(0 2px 5px #0009)}.map-sticker .airport-code{font-size:8px;letter-spacing:.08em;color:#f7dfa7}.map-sticker.endpoint{border:1.5px solid #f4d17d;box-shadow:0 0 0 3px #f4d17d35,0 0 22px #e6bf65aa;transform:translateY(-5px) scale(1.16)}.map-sticker.endpoint .landmark{font-size:30px}.map-sticker.selected{border:2px solid #fff0b8;box-shadow:0 0 0 5px #f4d17d45,0 0 32px #ffe08a;filter:brightness(1.35);transform:translateY(-8px) scale(1.22);z-index:12}.map-sticker.selected:after{content:'ĐANG XEM';position:absolute;top:-19px;left:50%;transform:translateX(-50%);padding:3px 6px;border-radius:8px;background:#f1d58f;color:#09233b;font:700 7px 'DM Sans',sans-serif;letter-spacing:.08em;white-space:nowrap}.map-sticker.nearby{animation:landmarkPop .55s ease both;border-color:#f4d17d;box-shadow:0 0 22px #e6bf65bb}.plane-vna{width:58px;height:58px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,#fff 0%,#f7e9c5 42%,#d2a94f 72%,#7e5a20 100%);border:2px solid #fff3c8;box-shadow:0 0 0 4px #d4ae5b40,0 0 26px #e8c76c;will-change:transform;backface-visibility:hidden}.plane-vna svg{width:48px;height:48px;filter:drop-shadow(0 2px 2px #15324b)}.plane-overlay{position:absolute;left:0;top:0;z-index:3;pointer-events:none;transform:translate3d(-1000px,-1000px,0);will-change:transform}.map-sticker.nearby{border-color:#ffe08a;box-shadow:0 0 0 3px #e6bf6540,0 0 24px #e6bf65;filter:brightness(1.2)}@keyframes landmarkPop{0%{transform:scale(.5);opacity:.2}70%{transform:scale(1.22)}100%{transform:scale(1);opacity:1}}
@media(max-width:760px){
 .topbar{padding:10px 12px}.logo{width:32px;height:32px;font-size:17px}.brand{gap:8px}.brand b{font-size:8px}.brand small{font-size:7px}.flight-chip{padding:7px 9px;font-size:9px;gap:6px}.flight-chip span{display:none}.top-actions .wide{display:none}
 .flight-summary{left:12px;top:68px;width:175px;padding:10px 11px}.summary-route b{font-size:20px}.summary-meta{font-size:8px}.map-tools{left:10px;top:auto;bottom:94px}.map-tools button{width:32px;height:32px}

 .drawer-head{padding:12px 14px}.drawer-head h2{font-size:17px}.drawer-content{padding:12px 13px 18px}

}
@media(max-width:390px){.brand small{letter-spacing:.08em}.flight-chip{display:none}.tab{font-size:8px}.tab .ico{display:none}}

/* Smart document library */
.library-hero{padding:13px;border:1px solid rgba(201,166,94,.34);border-radius:14px;background:linear-gradient(135deg,rgba(201,166,94,.14),rgba(255,255,255,.025));margin-bottom:12px}
.library-route{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}.library-route b{font:600 20px 'Playfair Display',serif;color:var(--gold2)}

.doc-card{align-items:flex-start}.doc-icon.pdf{background:rgba(232,57,57,.16);color:#ff8585}.doc-tag{display:inline-block;margin:5px 4px 0 0;padding:3px 6px;border-radius:5px;background:rgba(103,181,229,.12);color:#9bd4f5;font-size:8px}.doc-note{font-size:9px;color:#9fb1c2;line-height:1.45;margin-top:5px}.doc-actions{flex-wrap:wrap}.doc-actions button.primary{border-color:rgba(201,166,94,.6);color:var(--gold2)}
.upload-zone{border:1px dashed rgba(201,166,94,.55);border-radius:12px;padding:12px;background:rgba(201,166,94,.045)}.upload-zone input{font-size:10px;max-width:100%}.sample-banner{font-size:9px;color:#e9d7a9;line-height:1.5;margin:8px 0}

<div id="app">
 <div id="globeViz"></div><div class="shade"></div>

  <div class="flight-chip"><i class="chip-dot"></i><strong id="chipFlight">VN 220</strong><span id="chipRoute">SGN → HAN · HÔM NAY</span></div>

 </header>

 <div class="map-tools"><button id="homeBtn" title="Toàn cảnh">⌂</button><button id="zoomIn" title="Phóng to">＋</button><button id="zoomOut" title="Thu nhỏ">－</button></div>

  <div class="drawer-content" id="drawerContent"></div>

  <button class="tab" data-tab="briefing"><span class="ico">☷</span>Họp đầu chuyến</button>
 </nav>
 <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

function routeCityCodes(from,to){
  // Chỉ hiển thị các sân bay trong danh mục nằm gần hành lang bay trực tiếp.
  // Đây là điểm tham khảo trên bản đồ, không phải điểm dừng hay chặng nối chuyến.
  const a=byCode[from],b=byCode[to];if(!a||!b)return [];
  const rad=x=>x*Math.PI/180;
  const toVec=p=>{const lat=rad(p.lat),lng=rad(p.lng);return [Math.cos(lat)*Math.cos(lng),Math.cos(lat)*Math.sin(lng),Math.sin(lat)]};
  const dot=(u,v)=>u[0]*v[0]+u[1]*v[1]+u[2]*v[2];
  const cross=(u,v)=>[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];
  const norm=u=>Math.hypot(...u);
  const A=toVec(a),B=toVec(b),normal=cross(A,B),nn=norm(normal);
  if(!nn)return [];
  const N=normal.map(v=>v/nn),total=Math.acos(Math.max(-1,Math.min(1,dot(A,B))));
  return airports.filter(p=>p.code!==from&&p.code!==to).map(p=>{
    const P=toVec(p),crossTrack=Math.asin(Math.min(1,Math.abs(dot(P,N))));
    const along=Math.atan2(dot(cross(N,P),A),dot(P,A));
    return {code:p.code,along,distance:crossTrack};
  }).filter(p=>p.along>0.015&&p.along<total-0.015&&p.distance<rad(9))
    .sort((x,y)=>x.along-y.along).map(p=>p.code);
}

function runSimulation(from,to){

 const duration=10000,startTime=performance.now();

 Object.entries(airportMarkerEls).forEach(([code,el])=>{if(!el)return;el.classList.remove('nearby');el.classList.toggle('endpoint',code===from||code===to)});
 globe.controls().autoRotate=false;
 globe.arcsData([{startLat:a.lat,startLng:a.lng,endLat:b.lat,endLng:b.lng}]);
 // Đặt góc nhìn một lần duy nhất trước khi bay; không kéo camera theo máy bay mỗi frame.
 globe.pointOfView({lat:(a.lat+b.lat)/2,lng:midLng(a.lng,b.lng),altitude:Math.max(1.5,Math.min(2.5,1.35+Math.abs(a.lat-b.lat)/42))},650);

 $('app').appendChild(simPlaneEl);
 let lastPercent=-1,lastNearby='';
 const frame=(now)=>{
  if(!simActive||!globe)return;
  const raw=Math.min(1,(now-startTime)/duration);
  // Smoothstep easing avoids abrupt start/stop while preserving the 10-second duration.
  const t=raw*raw*(3-2*raw);
  const pos=interpolateGreatCircle(a,b,t);
  const screen=globe.getScreenCoords?globe.getScreenCoords(pos.lat,pos.lng,.12):null;
  if(screen&&Number.isFinite(screen.x)&&Number.isFinite(screen.y)){
   simPlaneEl.style.transform=`translate3d(${screen.x}px,${screen.y}px,0) translate(-50%,-50%)`;
  }
  const near=airports.filter(p=>p.code!==from&&p.code!==to&&distanceKm(pos,p)<650).map(p=>p.code);
  const nearKey=near.join('|');
  if(nearKey!==lastNearby){
   Object.entries(airportMarkerEls).forEach(([code,el])=>{
    if(!el)return;
    const active=near.includes(code);
    el.classList.toggle('nearby',active);
   });
   lastNearby=nearKey;
  }
  const percent=Math.floor(raw*100);
  if(percent!==lastPercent){
   $('simProgressBar').style.width=percent+'%';
   $('simPercent').textContent=percent+'%';
   $('simStatus').textContent=raw>=1?'Đã hạ cánh':`Đang bay · ${near.length} điểm bay lân cận`;
   lastPercent=percent;
  }
  if(raw>=1){
   simActive=false;simFrame=0;
   if(simPlaneEl){simPlaneEl.remove();simPlaneEl=null}
   Object.entries(airportMarkerEls).forEach(([code,el])=>{if(!el)return;el.classList.remove('nearby');el.classList.toggle('endpoint',code===from||code===to)});
   globe.controls().autoRotate=false;
   $('startSimulation').disabled=false;
   $('simStatus').textContent='Đã hạ cánh tại '+b.city;
   toast('Chuyến bay mô phỏng đã hạ cánh!');
   return;
  }
  simFrame=requestAnimationFrame(frame);
 };

}

{id:'demoflightmap',name:'THÔNG TIN ĐƯỜNG BAY NỘI ĐỊA',category:'Đặc điểm đường bay',scope:'routeClass',routeClass:'domestic',codes:['ALL'],date:'28 Jul 2026',size:'13 MB',summary:'Thông tin đường bay nội địa; mô phỏng tài liệu tham khảo.',sample:'TÀI LIỆU MÔ PHỎNG · THÔNG TIN ĐƯỜNG BAY NỘI ĐỊA\nPhạm vi mẫu: Các tuyến nội địa.\nNội dung chi tiết sẽ được thay bằng PDF do người dùng tải lên.'}
];
const docCategories=['Tất cả','An toàn','An ninh','Dịch vụ','Đặc điểm đường bay','Khác'];
let docCategoryFilter='Tất cả',docSearchText='';
function routeClassForFlight(f){if(!f)return 'domestic';const a=byCode[f.from],b=byCode[f.to];if(!a||!b)return 'international';if(a.country===b.country){const h=distanceKm(a,b)/800+.35;return h>2?'domesticLong':'domestic'}const km=distanceKm(a,b);return km<2000?'short':km<5000?'medium':'long'}
function routeClassLabel(c){return ({domestic:'Nội địa',domesticLong:'Nội địa trên 2 giờ',short:'Quốc tế ngắn',medium:'Quốc tế trung',long:'Quốc tế dài',international:'Quốc tế'})[c]||'Chưa xác định'}
function currentRouteDocs(){const f=selectedFlight||{from:'SGN',to:'HAN'},cls=routeClassForFlight(f),codes=[f.from,f.to];return demoDocuments.filter(d=>{if(d.scope==='common')return true;if(d.scope==='route')return d.codes.some(c=>codes.includes(c));if(d.scope==='routeClass')return d.routeClass===cls||(d.routeClass==='international'&&cls!=='domestic'&&cls!=='domesticLong');return false}).concat(documents.map(d=>({...d,uploaded:true})).filter(d=>{const c=d.routeClass||'common';if(c==='common')return true;if(c==='routeClass')return d.routeClassValue===cls;if(c==='route')return (d.codes||[]).some(x=>codes.includes(x));return false}))}
function renderDocuments(){
 const f=selectedFlight||{flight:'Chưa chọn',from:'SGN',to:'HAN'},cls=routeClassForFlight(f),list=currentRouteDocs();
 $('drawerContent').innerHTML=`<div class="library-hero"><div class="kicker">SMART FLIGHT DOCUMENT LIBRARY</div><div class="library-route"><div><small class="muted">CHUYẾN BAY ĐANG CHỌN</small><div><b>${f.from}</b> <span style="color:var(--gold)">✈</span> <b>${f.to}</b></div></div><span class="status">${routeClassLabel(cls)}</span></div><div class="muted" style="font-size:9px;margin-top:5px">${f.flight||''} · Tự động lọc theo tuyến và nhóm đường bay (ước tính theo cự ly)</div></div><div class="library-stats"><div class="library-stat"><b>${list.length}</b><small>TÀI LIỆU PHÙ HỢP</small></div><div class="library-stat"><b>${list.filter(d=>d.category==='An toàn').length}</b><small>AN TOÀN</small></div><div class="library-stat"><b>${list.filter(d=>d.category==='Dịch vụ').length}</b><small>DỊCH VỤ</small></div></div><div class="sample-banner">✦ DỮ LIỆU MÔ PHỎNG: tên tài liệu được lấy cảm hứng từ ảnh bạn gửi; nội dung chưa phải tài liệu khai thác chính thức.</div><div class="subheading">TẢI PDF LÊN THƯ VIỆN</div><div class="upload-zone"><div class="field"><label>CHỌN FILE PDF (CÓ THỂ CHỌN NHIỀU)</label><input id="docFile" type="file" multiple accept="application/pdf,.pdf"></div><div class="muted" style="font-size:9px">Hệ thống sẽ đọc chữ trong PDF để gợi ý nhóm tài liệu và phạm vi tuyến. PDF scan/ảnh chưa có OCR nên cần bạn kiểm tra thủ công.</div><button class="btn" id="uploadDocs">＋ TẢI LÊN & PHÂN LOẠI</button></div><div class="subheading">TÀI LIỆU CHO TUYẾN ${f.from} – ${f.to}</div><input class="search" id="docSearch" placeholder="Tìm mã TBAT, TBDV, tên tài liệu..." value="${docSearchText.replace(/"/g,'&quot;')}"><div class="doc-filter-row">${docCategories.map(c=>`<button class="doc-pill ${docCategoryFilter===c?'active':''}" data-doc-filter="${c}">${c}</button>`).join('')}</div><div id="docList"></div><div class="subheading">TÀI LIỆU CHỜ XÁC NHẬN PHẠM VI</div><div id="docReview"></div><div class="doc-note">Lưu ý: Phân loại tự động chỉ là gợi ý. Luôn kiểm tra REV, ngày hiệu lực, phạm vi áp dụng, loại tàu bay và chỉ đạo khai thác trước khi sử dụng.</div>`;
 $('uploadDocs').onclick=async()=>{const files=[...$('docFile').files];if(!files.length){toast('Hãy chọn ít nhất một file PDF.');return}let added=0;for(const file of files){if(file.size>25*1024*1024){toast(file.name+' vượt giới hạn 25 MB.');continue}try{const textContent=await extractPdfText(file);const meta=classifyUploadedDocument(file.name,textContent);const id='up'+Date.now()+Math.random().toString(16).slice(2);await storePdf(id,file);documents.push({id,name:file.name,size:file.size,category:meta.category,routeClass:meta.routeClass,routeClassValue:meta.routeClassValue,codes:meta.codes,scope:meta.scope,date:new Date().toLocaleDateString('vi-VN'),summary:meta.summary,uploaded:true});added++}catch(e){console.warn(e);toast('Không đọc được '+file.name+'; hãy thử lại với PDF có thể chọn văn bản.')}}save('vna_docs',documents);renderDocuments();toast(`Đã phân tích và thêm ${added} PDF`)};
 $('docSearch').oninput=e=>{docSearchText=e.target.value;renderDocList()};document.querySelectorAll('[data-doc-filter]').forEach(b=>b.onclick=()=>{docCategoryFilter=b.dataset.docFilter;renderDocuments()});renderDocList();
}
async function extractPdfText(file){try{if(!window.pdfjsLib){await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';sc.onload=resolve;sc.onerror=reject;document.head.appendChild(sc)})}pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const buf=await file.arrayBuffer(),pdf=await pdfjsLib.getDocument({data:buf}).promise;let out='';for(let i=1;i<=Math.min(pdf.numPages,40);i++){const page=await pdf.getPage(i),content=await page.getTextContent();out+=' '+content.items.map(x=>x.str).join(' ')}return out}catch(e){return file.name}}
function classifyUploadedDocument(name,body){const t=(name+' '+body).toLowerCase(),codes=['SGN','HAN','DAD','BKK','SIN','NRT','KIX','ICN','SYD','LHR','CDG','FRA','AMD'].filter(c=>new RegExp('\\b'+c.toLowerCase()+'\\b').test(t));let category=/tbat|safety|an toàn|losa|mệt mỏi|acu|an ninh/.test(t)?'An toàn':/tbdv|dịch vụ|service|suất ăn|ife|heritage|lotuscent/.test(t)?'Dịch vụ':/đường bay|route|domestic|international|đặc điểm/.test(t)?'Đặc điểm đường bay':'Khác';let routeClassValue=/domestic|nội địa/.test(t)?'domestic':/long haul|đường bay dài|quốc tế dài/.test(t)?'long':/medium haul|quốc tế trung/.test(t)?'medium':/short haul|quốc tế ngắn/.test(t)?'short':'common';let scope=codes.length?'route':routeClassValue!=='common'?'routeClass':/áp dụng chung|tất cả chuyến|mọi chuyến|all flights|all routes/.test(t)?'common':'review';return {category,routeClass:scope==='common'?'common':scope,routeClassValue,codes,scope,summary:body.trim().length<80?'PDF có thể là bản scan hoặc không trích xuất được chữ; cần xác nhận thủ công nhóm và phạm vi áp dụng.':'Phân loại tự động từ tên file và nội dung PDF; cần xác nhận lại phạm vi áp dụng.'}}
function openDemoPdf(d){const lines=(d.sample||'Tài liệu mô phỏng').split('\n');const html=`<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>${d.name}</title><body style="font-family:Arial,sans-serif;background:#eef2f5;padding:24px;color:#172536"><article style="max-width:760px;margin:auto;background:white;padding:34px;box-shadow:0 5px 25px #0002"><div style="color:#b58b42;font-weight:bold;letter-spacing:2px">VNA · FLIGHT BRIEFING · TÀI LIỆU MÔ PHỎNG</div><h2>${d.name}</h2><hr>${lines.map(x=>'<p>'+x+'</p>').join('')}<hr><p style="color:#a33;font-weight:bold">BẢN MÔ PHỎNG – KHÔNG DÙNG CHO KHAI THÁC THỰC TẾ</p></article></body></html>`;const w=window.open();if(w)w.document.write(html);else toast('Trình duyệt chặn cửa sổ xem tài liệu')}
function openPdfStore(id){getPdf(id).then(blob=>{if(!blob){toast('Không tìm thấy PDF trong bộ nhớ thiết bị.');return}const url=URL.createObjectURL(blob),w=window.open(url,'_blank');if(!w)toast('Trình duyệt đã chặn cửa sổ PDF')})}
function renderDocList(){const el=$('docList');if(!el)return;const all=currentRouteDocs().filter(d=>(docCategoryFilter==='Tất cả'||d.category===docCategoryFilter)&&(!docSearchText||d.name.toLowerCase().includes(docSearchText.toLowerCase())));if(!all.length){el.innerHTML='<div class="empty">Không có tài liệu phù hợp với bộ lọc của chặng bay này.</div>';return}el.innerHTML=all.map(d=>`<div class="doc-card"><div class="doc-icon pdf">PDF</div><div class="doc-main"><b>${d.name}</b><small>${d.date||'Tài liệu mẫu'} · ${d.size?typeof d.size==='number'?(d.size/1024).toFixed(0)+' KB':d.size:'PDF'}</small><span class="doc-tag">${d.category}</span><span class="doc-tag">${d.scope==='common'?'Chung':d.scope==='route'?'Theo tuyến':routeClassLabel(d.routeClassValue||d.routeClass)}</span><div class="doc-note">${d.summary||''}</div></div><div class="doc-actions"><button class="primary" data-open-doc="${d.id}">Mở</button>${d.uploaded?`<button data-del-doc="${d.id}">×</button>`:''}</div></div>`).join('');document.querySelectorAll('[data-open-doc]').forEach(b=>b.onclick=()=>{const d=all.find(x=>x.id===b.dataset.openDoc);if(d){if(d.demo||d.id.startsWith('demo'))openDemoPdf(d);else openPdfStore(d.id)}});document.querySelectorAll('[data-del-doc]').forEach(b=>b.onclick=async()=>{const id=b.dataset.delDoc;documents=documents.filter(x=>x.id!==id);await deletePdf(id);save('vna_docs',documents);renderDocuments()});const review=$('docReview');if(review){const pending=documents.filter(d=>d.scope==='review');review.innerHTML=pending.length?pending.map(d=>`<div class="doc-card"><div class="doc-icon pdf">PDF</div><div class="doc-main"><b>${d.name}</b><small>Chưa xác định phạm vi · Chưa tự động gắn vào tuyến</small></div><div class="doc-actions"><button data-review-common="${d.id}">Dùng chung</button></div></div>`).join(''):'<div class="empty">Không có tài liệu đang chờ xác nhận.</div>';review.querySelectorAll('[data-review-common]').forEach(b=>b.onclick=()=>{const d=documents.find(x=>x.id===b.dataset.reviewCommon);if(d){d.scope='common';d.routeClass='common';save('vna_docs',documents);renderDocuments();toast('Đã xác nhận tài liệu áp dụng chung')}})}}
function idb(){return new Promise((resolve,reject)=>{const r=indexedDB.open('vna_flight_pdf_store',1);r.onupgradeneeded=()=>r.result.createObjectStore('pdfs');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function storePdf(id,file){const db=await idb();return new Promise((resolve,reject)=>{const tx=db.transaction('pdfs','readwrite');tx.objectStore('pdfs').put(file,id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function getPdf(id){const db=await idb();return new Promise((resolve,reject)=>{const r=db.transaction('pdfs').objectStore('pdfs').get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function deletePdf(id){const db=await idb();return new Promise(resolve=>{const tx=db.transaction('pdfs','readwrite');tx.objectStore('pdfs').delete(id);tx.oncomplete=resolve;tx.onerror=resolve})}
const checklist=[
['Crew briefing & phân công','Rà soát vị trí, nhiệm vụ, phối hợp tổ bay và tình huống đặc biệt.'],
['An toàn cabin','Cửa thoát hiểm, trang thiết bị an toàn, demo và quy trình khẩn nguy.'],
['An ninh hàng không','Kiểm tra cabin, vật phẩm bất thường và quy trình an ninh.'],
['Thông tin hành khách đặc biệt','WCHC/WCHR, UM, INF, khách cần hỗ trợ và yêu cầu đặc biệt.'],
['Dịch vụ & suất ăn','Menu, suất ăn đặc biệt, đồ uống, sản phẩm và tiêu chuẩn phục vụ.'],
['Thông tin điểm đến','Thời tiết, giờ địa phương, sân bay, lưu ý khai thác và văn hóa.'],
['Xác nhận phối hợp tổ lái','Thống nhất thông tin khai thác, thời gian, liên lạc và nội dung cần lưu ý.']
];
function renderBriefing(){
 const f=selectedFlight,a=byCode[f.from],b=byCode[f.to],key=f.id,done=checkState[key]||[];
 $('drawerContent').innerHTML=`<div class="airport-card"><div class="kicker">PRE-FLIGHT BRIEFING</div><h3 style="font:600 21px 'Playfair Display',serif;margin:7px 0">${f.flight} · ${f.from} → ${f.to}</h3><p style="margin:0">${fmtDate(f.date)} · ${f.dep} – ${f.arr} · ${f.role||'Tổ bay'}</p></div><div class="subheading">CHECKLIST HỌP ĐẦU CHUYẾN</div><div class="flight-foot"><span>Tiến độ hoàn thành</span><strong id="checkCount">${done.length}/${checklist.length}</strong></div><div class="progress"><span id="progressBar" style="width:${done.length/checklist.length*100}%"></span></div>${checklist.map((c,i)=>`<label class="check-card"><input type="checkbox" data-check="${i}" ${done.includes(i)?'checked':''}><span><b>${c[0]}</b><small>${c[1]}</small></span></label>`).join('')}<div class="subheading">GHI CHÚ CUỘC HỌP</div><div class="field"><label>NỘI DUNG CẦN LƯU Ý</label><textarea id="briefNote" placeholder="Ghi chú phân công, lưu ý an toàn, dịch vụ...">${load('vna_note_'+key,'')}</textarea></div><div class="btn-row"><button class="btn" id="saveNote">LƯU GHI CHÚ</button><button class="btn secondary" id="resetChecks">ĐẶT LẠI CHECKLIST</button></div><p class="muted" style="font-size:9px;line-height:1.5">Checklist là khung tham khảo để tổ bay tùy chỉnh theo quy trình, tài liệu và chỉ đạo khai thác chính thức.</p>`;
 document.querySelectorAll('[data-check]').forEach(cb=>cb.onchange=()=>{let arr=checkState[key]||[];const n=Number(cb.dataset.check);arr=cb.checked?[...new Set([...arr,n])]:arr.filter(x=>x!==n);checkState[key]=arr;save('vna_checks',checkState);$('checkCount').textContent=arr.length+'/'+checklist.length;$('progressBar').style.width=(arr.length/checklist.length*100)+'%'});
 $('saveNote').onclick=()=>{save('vna_note_'+key,$('briefNote').value);toast('Đã lưu ghi chú cuộc họp')};
 $('resetChecks').onclick=()=>{checkState[key]=[];save('vna_checks',checkState);renderBriefing()};
}
function setTab(next,forceOpen=false){
 if(tab==='simulator'&&next!=='simulator')stopSimulation();
 tab=next;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 const titles={schedule:'Lịch bay của tôi',destinations:'Thông tin điểm đến',simulator:'Mô phỏng chuyến bay',documents:'Tài liệu chuyến bay',briefing:'Họp đầu chuyến'};
 $('drawerKicker').textContent='VNA · FLIGHT BRIEFING';$('drawerTitle').textContent=titles[tab];
 if(forceOpen)drawerOpen=true;$('drawer').classList.toggle('hidden',!drawerOpen);
 if(tab==='schedule')renderCalendar();if(tab==='destinations')renderDestinations();if(tab==='simulator')renderSimulator();if(tab==='documents')renderDocuments();if(tab==='briefing')renderBriefing();
}
function initGlobe(){
 if(typeof window.Globe!=='function'){$('mapHint').textContent='Không tải được bản đồ 3D. Vui lòng kiểm tra kết nối Internet.';return}
 globe=window.Globe()(document.getElementById('globeViz')).globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg').backgroundColor('rgba(0,0,0,0)').showAtmosphere(true).atmosphereColor('#5d9ac5').atmosphereAltitude(.17)
 .arcsData([]).arcStartLat('startLat').arcStartLng('startLng').arcEndLat('endLat').arcEndLng('endLng').arcColor(()=>['rgba(201,166,94,.12)','rgba(234,214,165,.98)']).arcAltitudeAutoScale(.25).arcStroke(.75).arcDashLength(.5).arcDashGap(.16).arcDashAnimateTime(2100)
 .pointsData([]).labelsData([]);
 globe.controls().autoRotate=false;globe.controls().autoRotateSpeed=0;globe.controls().enableDamping=true;globe.pointOfView({lat:19,lng:110,altitude:2.3},0);
 const globeRoot=document.getElementById('globeViz');
 if(!globeRoot.dataset.markerClickReady){
  globeRoot.dataset.markerClickReady='1';
  globeRoot.addEventListener('click',e=>{
   const marker=e.target.closest?.('.map-sticker');
   if(!marker)return;
   const code=marker.dataset.airportCode;
   if(code&&byCode[code]){e.preventDefault();e.stopPropagation();showAirport(code);}
  },true);
 }
 const resize=()=>globe&&globe.width(innerWidth).height(innerHeight);addEventListener('resize',resize);
}
function init(){
 initGlobe();updateMapRoute();setTab('schedule',true);
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(tab===b.dataset.tab&&drawerOpen){drawerOpen=false;$('drawer').classList.add('hidden')}else setTab(b.dataset.tab,true)});
 $('closeDrawer').onclick=()=>{drawerOpen=false;$('drawer').classList.add('hidden')};
 $('homeBtn').onclick=()=>{if(globe)globe.pointOfView({lat:19,lng:110,altitude:2.3},900);$('mapHint').textContent='Chạm biểu tượng thành phố trên địa cầu để khám phá';};
 $('zoomIn').onclick=()=>{if(globe){const p=globe.pointOfView();globe.pointOfView({...p,altitude:Math.max(.55,p.altitude*.78)},400)}};
 $('zoomOut').onclick=()=>{if(globe){const p=globe.pointOfView();globe.pointOfView({...p,altitude:Math.min(5,p.altitude*1.25)},400)}};

 $('fullBtn').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch(e){toast('Trình duyệt không hỗ trợ toàn màn hình')}};
 $('langBtn').onclick=()=>{lang=lang==='vi'?'en':'vi';$('langBtn').textContent=lang==='vi'?'VI / EN':'EN / VI';if(tab==='destinations')renderDestinations();toast(lang==='vi'?'Đã chuyển Tiếng Việt':'English selected')};
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
